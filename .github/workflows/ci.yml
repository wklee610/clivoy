name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race detector
        if: runner.os != 'Windows'
        run: go test -race ./...
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build native daemon smoke binary
        run: go build -o build/clivoy-daemon.exe ./cmd/clivoy
      - name: Verify daemon lifecycle
        run: python scripts/daemon_smoke.py ./build/clivoy-daemon.exe

  cross-build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -trimpath -o build/clivoy ./cmd/clivoy

  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install official SDKs
        run: python -m pip install -r scripts/requirements-sdk.txt
      - name: Build gateway
        run: go build -o build/clivoy ./cmd/clivoy
      - name: Verify OpenAI and Anthropic SDK requests
        run: python scripts/sdk_smoke.py --binary ./build/clivoy

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.14.0
          args: check
      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Build snapshot packages
        uses: goreleaser/goreleaser-action@v6
        with:
          version: v2.14.0
          args: release --snapshot --clean --skip=publish
      - name: Validate Homebrew checksums and formula
        run: |
          python3 -m unittest discover -s packaging -p 'test_*.py'
          python3 scripts/release-homebrew.py --tag v0.0.0-dev
          ruby -c dist/clivoy.rb
      - name: Install APT tooling
        run: sudo apt-get update && sudo apt-get install -y apt-utils gnupg
      - name: Verify signed APT repository and package installation
        run: bash scripts/package-smoke.sh dist
      - name: Build and smoke-test nonroot container
        run: |
          docker build --tag clivoy:ci .
          docker run --rm clivoy:ci version
